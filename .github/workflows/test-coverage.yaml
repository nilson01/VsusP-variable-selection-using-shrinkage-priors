name: test-coverage

on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/test-coverage.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      _R_CHECK_LIMIT_CORES_: 'true'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Configure lean system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-vsusp-ci <<'EOF'
          APT::Install-Recommends "false";
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Measure test coverage
        run: |
          stopifnot(requireNamespace("posterior", quietly=TRUE))
          coverage <- covr::package_coverage(
            type="tests", quiet=FALSE, clean=FALSE,
            install_path=file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
          percent <- covr::percent_coverage(coverage)
          stopifnot(length(coverage)>0, is.finite(percent), percent>0)
          print(coverage)
          covr::to_cobertura(coverage, filename="cobertura.xml")
        shell: Rscript {0}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: error
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Report missing upload configuration
        if: env.CODECOV_TOKEN == ''
        run: echo 'Codecov upload is not configured; the coverage file is retained as an artifact.'
      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore
