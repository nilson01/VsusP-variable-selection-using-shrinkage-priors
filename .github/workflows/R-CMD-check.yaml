name: R-CMD-check

on:
  push:
    branches: [main, master]
    paths-ignore: [cran-comments.md]
  pull_request:
    branches: [main, master]
    paths-ignore: [cran-comments.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}${{ matrix.config.docs && ', documentation' || '' }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-24.04, r: 'release', docs: true}
          - {os: ubuntu-24.04, r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_LIMIT_CORES_: 'true'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_SYSTEM_CLOCK_: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - name: Install documentation check tools
        if: matrix.config.docs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ghostscript qpdf tidy
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.docs
      - name: Install reference-manual TeX packages
        if: matrix.config.docs
        run: |
          tlmgr update --self
          tlmgr install makeindex times inconsolata helvetic ec float placeins
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.docs && 'any::V8' || '' }}
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: ${{ matrix.config.docs && 'c("--no-manual", "--compact-vignettes=gs+qpdf")' || 'c("--no-manual", "--no-build-vignettes")' }}
          args: ${{ matrix.config.docs && '"--as-cran"' || 'c("--as-cran", "--no-manual", "--ignore-vignettes", "--no-build-vignettes")' }}
          upload-results: 'true'
      - name: Verify installed tests and required documentation
        run: Rscript tools/check-results.R check ${{ matrix.config.docs && 'full' || '' }}
